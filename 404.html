<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 &mdash; Page not found</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{--bg:#f2f4fb;--fg:#21243a;--muted:#4d568c;--accent:#076a86;--rule:#bcc3de}
  @media(prefers-color-scheme:dark){
    :root{--bg:#212337;--fg:#ebfafa;--muted:#abb4da;--accent:#04d1f9;--rule:#414868}
  }
  *{box-sizing:border-box}
  body{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;background:var(--bg);
       color:var(--fg);margin:0;min-height:100vh;display:flex;align-items:center;
       justify-content:center;padding:1.5rem;line-height:1.7}
  main{max-width:34rem;border-left:1px solid var(--rule);padding-left:1.5rem}
  h1{font-size:1.25rem;letter-spacing:-.03em;margin:0 0 .5rem}
  p{color:var(--muted);font-size:.875rem;margin:0 0 1.5rem}
  ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:.5rem}
  a{display:inline-block;border:1px solid var(--rule);padding:.25rem .625rem;
    font-size:.75rem;color:var(--accent);text-decoration:none}
  a:hover{border-color:var(--accent)}
  .code{font-size:.625rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>
    This site is now a single page, so some older links no longer resolve.<br>
    Ce site tient maintenant sur une seule page, alors certains anciens liens ne fonctionnent plus.
  </p>
  <ul>
    <li><a href="/">English</a></li>
    <li><a href="/fr">Fran&ccedil;ais</a></li>
    <li><a href="/#research">Research</a></li>
    <li><a href="/#news">News</a></li>
  </ul>
</main>
</body>
</html>
